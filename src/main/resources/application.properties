spring.application.name=interview
server.port=8090

# 로컬 비밀 설정 파일(git 제외)이 있으면 읽는다. 환경변수 대신 쓸 수 있다
spring.config.import=optional:file:./config/application-local.properties

# DB (PostgreSQL) - 비밀번호는 환경변수 DB_PASSWORD로만 받는다
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# AI와 대화 스트림(StreamingResponseBody)은 비동기 요청이라 기본 30초에 끊기지 않게 (재시도 포함 AI 시간 제한 두 번보다 길게)
spring.mvc.async.request-timeout=300s
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# 업로드
upload.max-size-mb=500
upload.max-request-mb=2048
spring.servlet.multipart.max-file-size=${upload.max-size-mb}MB
spring.servlet.multipart.max-request-size=${upload.max-request-mb}MB
# 한도를 넘은 업로드도 끝까지 받아야 오류 안내 화면을 보낼 수 있다 (기본 2MB면 연결이 끊긴다)
server.tomcat.max-swallow-size=-1

# AI (OpenAI 호환 Chat Completions) - 키는 환경변수로만 받는다
ai.api-key=${AI_API_KEY:${OPENAI_API_KEY:}}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}
# 적합도 검사(근거·경력 계산, 학력·타임라인)만 따로: 겹치는 기간 계산은 추론 모델이어야 정확하다 (모델 비교 2026-10-19: gpt-5-mini 12/12, gpt-4o-mini 7/12)
ai.reasoning-model=${AI_REASONING_MODEL:gpt-5-mini}
# 추론에 쓰는 토큰도 출력 한도에 들어간다
ai.reasoning-max-tokens=25000
# 근거 분석(EVIDENCE)의 생각 양 (minimal, low, medium, high; 비우면 모델 기본 medium)
ai.evidence-reasoning-effort=${AI_EVIDENCE_REASONING_EFFORT:low}
ai.max-tokens=8000
# 신형 OpenAI 모델은 max_completion_tokens, 그 외 호환 API는 max_tokens
ai.max-tokens-param=max_completion_tokens
ai.json-mode=true
ai.timeout-seconds=300
# URL에 jsessionid를 붙이지 않는다
server.servlet.session.tracking-modes=cookie

# 로컬 AI (Ollama) - 이력서 원문은 여기로만 보내 개인정보를 찾는다
local-ai.base-url=${LOCAL_AI_BASE_URL:http://localhost:11434}
local-ai.model=${LOCAL_AI_MODEL:gemma4:e4b}
local-ai.num-ctx=8192
local-ai.timeout-seconds=300
local-ai.think=true
# 마지막 호출 뒤 모델을 메모리에 두는 시간 (Ollama 기본 5분)
local-ai.keep-alive=${LOCAL_AI_KEEP_ALIVE:1h}
