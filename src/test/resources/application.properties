spring.datasource.url=jdbc:h2:mem:interview;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
upload.max-size-mb=10
ai.api-key=test-key
ai.base-url=http://localhost:9/v1
ai.model=test-model
ai.max-tokens=1000
ai.max-tokens-param=max_tokens
ai.json-mode=true
ai.timeout-seconds=5

# URL에 jsessionid를 붙이지 않는다
server.servlet.session.tracking-modes=cookie

# 업로드 (포지션 이미지 여러 장)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
